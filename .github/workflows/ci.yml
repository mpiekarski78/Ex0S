name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Freeze and batteries
        run: |
          python tests/test_tm011family.py
          python tests/test_tm011bound.py
          python tests/test_tm012context.py
          python tests/test_tm012minimap.py
          python tests/test_tm012pathdisc.py
          python tests/test_tm012midpath.py
          python tests/test_tm012routesig.py
          python tests/test_tm012routesig_depth.py
          python tests/test_tm012routesig_identity.py
          python tests/test_tm013context.py
          python tests/test_tm013family.py
          python tests/test_tm014acquire.py
          python tests/test_tm014family.py
          python tests/test_tm015skeleton.py
          python tests/test_tm016relate.py
          python tests/test_tm016aliaswall.py
          python tests/test_tm016aliasfinger.py
          python tests/test_tm016gapwall.py
          python tests/test_continuity_evidence_contract.py
          python tests/test_tm016persist.py
          python tests/test_tm016lifewall.py
          python tests/test_tm017symbolworld.py
          python tests/test_tm018sequence.py
          python tests/test_tm019inquire.py
          python tests/test_tm020reliability.py
          python tests/test_tm021perspective.py
          python tests/test_tm022interpret.py
          python tests/test_tm023cortex.py
          python -m experiments.run_tm023cortex --verify-prereg
          python -m experiments.run_tm023cortex --verify-sanity-amendment
          python -m experiments.run_tm023cortex --verify-v4-gate
          python -m experiments.run_tm023cortex --verify-v5-gate
          python -m experiments.run_tm023cortex --verify-v6-gate
          python -m experiments.run_tm023cortex --verify-v7-gate
          python -m experiments.run_tm023cortex --verify-v8-gate
          python -m experiments.run_tm023cortex --verify-v9-gate
          python -m experiments.run_tm023cortex --verify-v10-gate
          python -m experiments.run_tm023cortex --verify-v11-gate
          python -m experiments.run_tm023cortex --verify-v12-gate
          python -m experiments.run_tm023cortex --verify-v13-gate
          python -m experiments.run_tm023cortex --verify-fulldev-r1
