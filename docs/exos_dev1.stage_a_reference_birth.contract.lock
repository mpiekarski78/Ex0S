    "action_sampling": "softmax(motor_logits / temperature); training=stochastic; validation/confirmation=hard",
    "update_clipping": "clamp Delta W to [-0.1, 0.1] per step",
    "normalization": "optional homeostatic rho normalization from inherited coefficients",
    "reward_timing": "scalar reward delivered on consequence observe(); credit on apply_outcome_credit()",
