      "fixture_answers",
      "task_symbols"
    ],
    "after_gestation_action_selection": "a_star = argmax_a V(s_hat_{t+1}(s_t, a))",
    "V": "organism_owned_homeostatic_valence",
    "synergy_candidates": ["forward", "backward", "rotate_left", "rotate_right"],
    "interpretation": "gestation_learns_consequences__lifetime_drives_select_desirable_consequence"
