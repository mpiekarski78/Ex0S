  "claim": "Two opaque aliases may be treated as equivalent only when observable behavioral evidence shows the same consequences under multiple independent probe contexts, without supplying a hidden role, canonical identity, equivalence class, mapping, or route position as identity.",
  "evidence_rule": {
    "name": "behavioral_fingerprint",
    "fingerprint_atom": [
      "probe_context",
      "action",
      "observed_outcome"
    ],
    "minimum_independent_probe_contexts": 2,
    "one_matching_consequence_is_sufficient": false,
    "two_independent_matching_consequences_permit_equivalence": true,
    "permission_is_not_a_claimed_pass": true,
    "route_position_is_sufficient_evidence": false,
    "scorer_only_may_know_latent_map": true,
    "matching": "For each witness, both aliases must have the same action and observed_outcome under the same probe_context.",
    "independence": "The two witnesses must use distinct probe_context identities and must not be duplicate, relabelled, or role-coded presentations of the same probe."
  },
  "channel_contract": {
    "allowed_keys": [
      "alias",
      "probe_context",
      "action",
      "observed_outcome"
    ],
    "field_semantics": {
      "alias": "opaque token under probe",
      "probe_context": "independent probe identity; not a role, canonical identity, or route position",
      "action": "motor or act taken",
      "observed_outcome": "success, failure, or a named observable outcome enum; never role-coded"
    },
    "forbidden_keys": [
      "role",
      "equivalence_class",
      "canonical_token",
      "canonical_id",
      "role_to_alias",
      "alias_to_role",
      "latent_map",
      "route_position_identity"
    ],
    "forbidden_information": [
      "hidden role",
      "equivalence class",
      "canonical token or ID",
      "role-to-alias or alias-to-role map",
      "route position presented or interpreted as identity"
    ],
    "future_organism_authorship": "A future candidate may author fingerprint and equivalence evidence into S only; this prereg implements no such mechanism.",
    "scorer_boundary": "The scorer alone may retain the latent mapping for evaluation and must never pass it through events, teacher information, S, agent arguments, or organism-visible diagnostics."
  },
  "battery_contract": [
    {
      "cell": "A0_wall",
      "evidence": "same latent route only; reuse the frozen ALIASWALL Kill condition",
      "honest_outcome": "HOLD",
      "gate": "kill_if_not_HOLD"
    },
    {
      "cell": "A1_weak",
      "evidence": "one matching observable consequence",
      "honest_outcome": "HOLD; ambiguous",
      "gate": "kill_if_not_HOLD"
    },
    {
      "cell": "A2_convergent",
      "evidence": "two matching observable consequences under independent probe contexts",
      "honest_outcome": "equivalence permitted",
      "gate": "future_candidate_contract_earn_condition_not_scored_this_pass"
    },
    {
      "cell": "A3_collision",
      "evidence": "same first consequence and different second consequence",
      "honest_outcome": "keep separate",
      "gate": "kill_if_merged"
    },
    {
      "cell": "A4_swap",
      "evidence": "behavioral fingerprints exchanged between aliases",
      "honest_outcome": "behavior follows observable evidence, not alias spelling or route position",
      "gate": "kill_if_behavior_does_not_follow_evidence"
    },
    {
      "cell": "A5_contradiction",
      "evidence": "later observable evidence conflicts with an earlier fingerprint",
      "honest_outcome": "split or HOLD",
      "gate": "kill_if_conflict_is_ignored"
    },
    {
      "cell": "A6_causality",
      "evidence": "reset rho, wipe S, and donor swap",
      "honest_outcome": "equivalence follows S only: reset rho retains; wipe S removes; donor swap follows donor S",
      "gate": "kill_if_equivalence_does_not_follow_S_only"
    }
  ],
  "isolation": {
