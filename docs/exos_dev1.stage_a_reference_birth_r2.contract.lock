  "R2_SEL_1": {
    "title": "Lexicographic learning-effect-aware outer fitness",
    "lexicographic_order": [
      "accuracy_or_reward_improvement",
      "signed_rewarded_margin_improvement",
      "retention",
      "seeded_neutral_tie_break"
    ],
    "forbidden_fitness_terms": [
      "raw_update_norm",
      "permanent_parent_priority_on_ties"
    ],
    "dense_causal_term_per_credit": {
      "formula": "g_t = s_t * (m_a,t^after - m_a,t^before)",
      "s_t": "+1 for positive outcome; -1 for negative outcome",
      "m_a": "rewarded-action margin for the credited actor channel of that event",
      "meaning": "Rewarding an action should raise its margin; penalizing it should lower its margin"
    },
    "required_selector_tests": [
      "equal_accuracy_better_signed_margin_mutant_wins",
      "larger_update_worse_signed_margin_mutant_loses",
      "better_accuracy_always_beats_margin_only_improvement",
      "complete_ties_use_seeded_neutral_tie_break_not_parent_priority"
    ],
    "selection_fitness_and_behavioral_pass_gates_remain_separate": true
  },

  "R2_TEACH_1": {
    "title": "Separated self-action and teacher-demonstration credit",
    "forbidden": [
      "combine_demonstrated_action_with_reward_from_organism_sampled_action",
      "runner_constructed_neural_target",
      "runner_owned_weight_update",
      "teacher_outcome_rewrites_sampled_action_eligibility",
      "self_action_reward_updates_teacher_target"
    ],
    "rationale": "If the organism sampled wrong and received negative reward, substituting the teacher correct channel into that same credit would depress the demonstrated action.",
    "two_explicit_credit_events": [
      {
        "credit_source": "self_action",
        "actor_target": "sampled_channel",
        "learning_signal": "environment_outcome_or_TD_error"
      },
      {
        "credit_source": "teacher_demonstration",
        "actor_target": "demonstrated_channel",
        "learning_signal": "outcome_or_generic_teaching_signal_associated_with_that_demonstration"
      }
    ],
    "teacher_event_law": {
      "has_own_eligibility_and_credit_source": true,
      "runner_delivers": ["observed_motor_event", "its_consequence"],
      "runner_never_constructs": ["neural_target", "weight_update"]
    },
    "required_controls": [
      "teacher_credit_off_state_injection_alone_does_not_teach",
      "permuted_demonstration_learning_follows_observed_demonstration",
      "self_action_reward_never_updates_teacher_target",
      "teacher_outcome_never_rewrites_sampled_action_eligibility",
      "conflicting_self_and_teacher_events_remain_separately_attributable"
    ]
  },

