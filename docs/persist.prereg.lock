{
  "version": "TM.0.16.PERSIST.PREREG",
  "lab": "TM.0.16.PERSIST",
  "ex0s_under_test": "0.0.004",
  "earned_next": false,
  "ex0s": null,
  "not_tm017": true,
  "label": "opt-in mark-continuity persistence candidate under frozen continuity-evidence contract",
  "preregistered_claim": "An opt-in recipe may author raw continuity rows into S from exact observe_continuity_mark tuples and, at use time only, recompute a one-hop P → Q projection from those rows so that a unique causal apply→read witness can complete an identity-dependent probe. mark_id scopes an intervention attempt, not an object; it is fresh/counterbalanced between worlds and cannot establish continuity without the corresponding apply/read observations. Token spelling, skip, sole candidacy, and route position contribute no identity evidence. Permission is defeasible and disappears when recomputed evidence is no longer unique.",
  "observation_abi": "observe_continuity_mark",
  "channel_key_rule": "set(info) == {token, mark_id, phase, operation, observed_state}",
  "source": "experience_continuity",
  "flag": "use_continuity_mark",
  "flag_default": false,
  "factory": "experiments.run_tm016persist.make_persist",
  "factory_note": "make_persist constructs from make_finger then sets use_continuity_mark; do not edit run_tm054.make, make_finger, or make_relate",
  "uniqueness": {
    "rule": "For (mark_id, observed_state), permission exists only when exactly one pre-gap apply identifies token P and exactly one post-gap read identifies token Q. Multiple matching applies, multiple matching reads, no match, or conflicting reads produce no permission.",
    "count_unit": "observation_rows",
    "conflicting_reads": "same token with two distinct observed_state values for the same mark_id refuses permission for that mark_id",
    "second_matching_read_is_c5": true
  },
  "projection": {
    "kind": "one_hop_P_to_Q_recomputed_at_use_time",
    "reads_sources": ["experience_continuity"],
    "inaccessible_sources": ["experience_fingerprint"],
    "project_only": "the existing experience_skel edge needed for the current probe",
    "forbidden": [
      "same_as",
      "canonicalize tokens",
      "rewrite skeleton rows",
      "cache a persistent link",
      "transitive closure",
      "general token equality",
      "permanent token to mark_id map"
    ]
  },
  "abi_vs_weak": {
    "malformed_or_phase_op_mismatch": "reject; write nothing to S",
    "flag_off": "why=continuity_off; write nothing",
    "valid_apply_without_read": "accept observation; no permission; probe HOLD",
    "valid_read_without_apply": "accept observation; no permission; probe HOLD",
    "reappear_without_evidence": "no continuity rows; probe HOLD",
    "bare_mark_id": "ABI reject, not a C1 HOLD"
  },
  "contradiction": {
    "C5_later_state": "linked candidate later returns a different observed_state",
    "C5_second_read": "another candidate later produces the matching read",
    "C5_second_apply": "additional apply makes the pre-gap source ambiguous",
    "rows_remain_in_S": true,
    "permission_recomputed": true,
    "reprobe_after": true,
    "soft_hold_without_withdrawal_forbidden": true
  },
  "tokens": {
    "P": "kelm",
    "dest": "wift",
    "Q": "norb",
    "R": "jasp"
  },
  "marks": {
    "default": "mk_alpha",
    "swap_world": "mk_beta",
    "matching_state": "on",
    "other_state": "off"
  },
  "initial_skeleton": {
    "episodes": [[["kelm"], ["wift"]]],
    "end_each_episode": true,
    "edge": "kelm->wift",
    "support": 1
  },
  "query_protocol": {
    "probe": "traverse_hold",
    "teacher": "off",
    "report_lived_bind": true
  },
  "isolation": {
    "fresh_organism_per_cell": true,
    "empty_S": true,
    "reset_rho_before_probe": true,
    "no_shared_state_across_cells": true,
    "c6_may_strip_or_donate_within_cell": true,
    "ground_truth_scorer_only": true
  },
  "cell_ids": [
    "C0_gapwall",
    "C1_weak",
    "C2_mark",
    "C3a_both",
    "C3b_neither",
    "C3c_conflict",
    "C4_swap",
    "C5_contradiction",
    "C6_causality"
  ],
  "fixtures": {
    "C0_gapwall": {
      "continuity_observations": [],
      "reuse": {
        "G1_empty_skip": {
          "episodes": [[["a"], [], ["b"], ["c"]]],
          "end_each_episode": true,
